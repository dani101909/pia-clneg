name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cleanpro
          POSTGRES_PASSWORD: cleanpro
          POSTGRES_DB: cleanpro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleanpro -d cleanpro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://cleanpro:cleanpro@localhost:5432/cleanpro_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas unitarias, de integracion (SQLite y PostgreSQL) y cobertura
        run: python -m pytest tests --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ matrix.python-version }}
          path: coverage.xml

  imagen-docker:
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t cleanpro:ci .
